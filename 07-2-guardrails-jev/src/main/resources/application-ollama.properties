# The guardrail's DecisionModel on a local Ollama model, with no TypeSafe key:
#   ollama pull d1-omni:600m
#   mvn spring-boot:run -pl 07-2-guardrails-jev -Dspring-boot.run.profiles=ollama
spring.ai.model.decision=ollama
spring.ai.ollama.decision.model=d1-omni:600m

# The small local model puts the self-harm signal of the third question in the review band, between 0.35
# and 0.70, where a turn passes by default. Refuse on review, so that it gets the support message.
demo.guardrail.block-on-review=true
