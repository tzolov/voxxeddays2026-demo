spring.main.banner-mode=off
spring.main.web-application-type=none
spring.threads.virtual.enabled=true

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.max-tokens=2000
spring.ai.anthropic.chat.model=claude-sonnet-5-5

# The chat model. The Ollama starter is on the classpath too, for its decision model only
spring.ai.model.chat=anthropic
spring.ai.model.embedding=none

# The guardrail's DecisionModel: TypeSafe's Jev through the System One provider.
# The 'ollama' profile (application-ollama.properties) switches to a local model, with no TypeSafe key.
spring.ai.model.decision=systemone
spring.ai.systemone.api-key=${TYPESAFE_API_KEY:}

# Whether a borderline result (REVIEW) is refused too. Jev is sure enough about the three questions of the
# demo; the 'ollama' profile turns it on.
demo.guardrail.block-on-review=false

# spring.ai.systemone.base-url=http://localhost:11434
# spring.ai.systemone.api-key=ollama
# spring.ai.systemone.decision.model=nimble
# spring.ai.systemone.timeout=60s
# spring.ai.systemone.retry.timeout=150s

spring.ai.inspector.enabled=true