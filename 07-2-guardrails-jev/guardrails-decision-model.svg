<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 0 956 462" width="956" role="img" aria-labelledby="guardrails-title guardrails-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="currentColor">
<defs><marker id="guardrails-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker><marker id="guardrails-arrow-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9A5B00"/></marker></defs>
<title id="guardrails-title">Guardrails with a decision model</title>
<desc id="guardrails-desc">The guardrails demo. The harness is a ChatClient and its advisor chain. DecisionGuardrailAdvisor, from the community project Spring AI Decision Extensions, screens the user's question before the chat model is called and the answer after it. For each direction it sends one battery of hazards to a DecisionModel, here Jev through the System One provider, in a single decision call: jailbreak, physical harm and illegal requests lead to BLOCK, signs of self-harm lead to SUPPORT. When the question passes, it goes on to ChatModelCallAdvisor, which calls the chat model, and the answer comes back through the output battery. When the outcome is BLOCK or SUPPORT, the advisor answers the user with a refusal and the chat model is never called. The logging advisor of the demo is left out.</desc>
<text x="528" y="30" text-anchor="middle" font-size="20" font-weight="700">Guardrails with a <tspan fill="#6DB33F">decision model</tspan></text>

<!-- The user -->
<rect x="350" y="46" width="170" height="46" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="435.0" y="66.0" text-anchor="middle" font-size="13" font-weight="600">User</text><text x="435.0" y="83.0" text-anchor="middle" font-size="11" fill-opacity="0.75">three questions</text>
<path d="M400.0 93.0 L400.0 138.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#guardrails-arrow)"/>
<path d="M470.0 139.0 L470.0 95.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#guardrails-arrow)"/>

<!-- The harness -->
<rect x="258" y="104" width="426" height="234" rx="12" fill="#6DB33F" fill-opacity="0.05" stroke="#6DB33F" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="274.0" y="126.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#6DB33F">Harness</text>
<text x="670.0" y="126.0" text-anchor="end" font-size="12" fill-opacity="0.75" font-style="italic">ChatClient + advisor chain</text>

<rect x="300" y="140" width="360" height="74" rx="8" fill="#3F7DE0" fill-opacity="0.12" stroke="#3F7DE0" stroke-width="1.2"/><text x="480.0" y="161.0" text-anchor="middle" font-size="13" font-weight="600" fill="#3F7DE0">DecisionGuardrailAdvisor</text><text x="480.0" y="180.0" text-anchor="middle" font-size="11" fill-opacity="0.8">input battery: screens the question</text><text x="480.0" y="197.0" text-anchor="middle" font-size="11" fill-opacity="0.8">output battery: screens the answer</text>
<rect x="300" y="274" width="360" height="46" rx="8" fill="#6DB33F"/><text x="480.0" y="294.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">ChatModelCallAdvisor</text><text x="480.0" y="311.0" text-anchor="middle" font-size="11" fill="#fff">calls the model</text>

<path d="M400.0 215.0 L400.0 272.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#guardrails-arrow)"/>
<path d="M560.0 273.0 L560.0 217.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#guardrails-arrow)"/>
<text x="390.0" y="248.0" text-anchor="end" font-size="11.5" font-weight="600" fill="#6DB33F">PASS</text>
<text x="570.0" y="248.0" text-anchor="start" font-size="11" fill-opacity="0.75" font-style="italic">the answer</text>

<!-- The model -->
<path d="M480.0 321.0 L480.0 360.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#guardrails-arrow)"/>
<rect x="405" y="362" width="150" height="42" rx="8" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="480.0" y="387.5" text-anchor="middle" font-size="14">ChatModel</text>
<text x="575.0" y="388.0" text-anchor="start" font-size="15" font-weight="700">Model</text>

<!-- The refusal -->
<path d="M298.0 177.0 H200.0 V69.0 H347.0" fill="none" stroke="#9A5B00" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#guardrails-arrow-stop)"/>
<text x="190.0" y="112.0" text-anchor="end" font-size="11.5" font-weight="700" fill="#9A5B00">BLOCK or SUPPORT</text>
<text x="190.0" y="128.0" text-anchor="end" font-size="11" font-weight="600" fill="#9A5B00">a refusal: the model</text>
<text x="190.0" y="144.0" text-anchor="end" font-size="11" font-weight="600" fill="#9A5B00">is never called</text>

<!-- The decision model -->
<rect x="776" y="124" width="216" height="118" rx="8" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/>
<text x="884.0" y="148.0" text-anchor="middle" font-size="14" font-weight="700">DecisionModel</text>
<text x="884.0" y="165.0" text-anchor="middle" font-size="11" fill-opacity="0.75" font-style="italic">Jev, through the System One provider</text>
<text x="790.0" y="190.0" text-anchor="start" font-size="11" fill-opacity="0.8">one call for a battery of hazards:</text>
<text x="790.0" y="208.0" text-anchor="start" font-size="11" fill-opacity="0.8">• jailbreak, harm, illegal: BLOCK</text>
<text x="790.0" y="226.0" text-anchor="start" font-size="11" fill-opacity="0.8">• self-harm: SUPPORT</text>
<path d="M662.0 163.0 L773.0 163.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#guardrails-arrow)"/>
<text x="730.0" y="155.0" text-anchor="middle" font-size="11" fill-opacity="0.75">the question</text>
<path d="M662.0 199.0 L773.0 199.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#guardrails-arrow)"/>
<text x="730.0" y="191.0" text-anchor="middle" font-size="11" fill-opacity="0.75">the answer</text>

<!-- Legend -->
<rect x="268" y="432" width="18" height="14" rx="3" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="293.0" y="443.5" text-anchor="start" font-size="11.5" fill-opacity="0.8">Spring AI 2.1</text>
<rect x="392" y="432" width="18" height="14" rx="3" fill="#3F7DE0" fill-opacity="0.12" stroke="#3F7DE0" stroke-width="1.2"/><text x="417.0" y="443.5" text-anchor="start" font-size="11.5" fill-opacity="0.8">Spring AI Decision Extensions (Community)</text>
<rect x="672" y="432" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="697.0" y="443.5" text-anchor="start" font-size="11.5" fill-opacity="0.8">the application</text>
</svg>
