spring.main.banner-mode=off
spring.main.web-application-type=none
spring.threads.virtual.enabled=true

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.max-tokens=2000
spring.ai.anthropic.chat.model=claude-sonnet-5-5

spring.ai.inspector.enabled=true
# Stable cache for the ONNX embedding model (~90MB). The default is a new temp dir per run, i.e. a re-download on every start.
spring.ai.embedding.transformer.cache.directory=${user.home}/.spring-ai/model-cache
