spring.main.banner-mode=off
spring.main.web-application-type=none
spring.threads.virtual.enabled=true

# Gemini Developer API with a key from https://aistudio.google.com/apikey (GOOGLE_API_KEY in .env), or,
# with no key, Vertex AI with the project and location below and your gcloud application-default login.
spring.ai.google.genai.api-key=${GOOGLE_API_KEY:}
spring.ai.google.genai.project-id=${GOOGLE_CLOUD_PROJECT:}
spring.ai.google.genai.location=${GOOGLE_CLOUD_LOCATION:}
# A chat model that answers with images (and text). Others: gemini-3.1-flash-image, gemini-3-pro-image.
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite-image

spring.ai.inspector.enabled=true
# What the inspector shows: the Google GenAI SDK doesn't go through the inspector's proxy, so there is no
# wire view; the ChatClient advisors report both turns, with the image the model drew in the answer and the
# same image as media of the second request, uploaded once for the previews.
# Costs: two image generations with the lite model: a few cents per run.
