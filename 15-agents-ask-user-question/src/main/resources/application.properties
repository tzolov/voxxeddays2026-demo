spring.application.name=recursive-advisor-demo
spring.main.web-application-type=none

## Anthropic Claude SDK
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=claude-sonnet-5-5
spring.ai.anthropic.chat.max-tokens=1000


## OpenAI SDK
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-5-mini-2025-08-07
spring.ai.openai.chat.temperature=1.0


## Google GenAI SDK
spring.ai.google.genai.project-id=${GOOGLE_CLOUD_PROJECT}
# spring.ai.google.genai.location=${GOOGLE_CLOUD_LOCATION}
spring.ai.google.genai.location=global
spring.ai.google.genai.chat.model=gemini-3.1-pro-preview

spring.ai.inspector.enabled=true








