spring.main.banner-mode=off
spring.main.web-application-type=none
spring.threads.virtual.enabled=true

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.max-tokens=2000
spring.ai.anthropic.chat.options.model=claude-sonnet-5-5

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-5-mini-2025-08-07
spring.ai.openai.chat.options.temperature=1.0


# Tool Search Tool Advisor Configuration
spring.ai.chat.client.tool-search-advisor.enabled=true
# spring.ai.chat.client.tool-search-advisor.tool-index-type=regex
# spring.ai.chat.client.tool-search-advisor.tool-index-type=lucene
# spring.ai.chat.client.tool-search-advisor.tool-index-type=vector
spring.ai.chat.client.tool-search-advisor.tool-index-type=jev

# tool-index-type=jev uses TypeSafe's Jev; the TypeSafe client needs the key
spring.ai.typesafe.api-key=${TYPESAFE_API_KEY:}

spring.ai.chat.client.tool-search-advisor.reference-tool-name-accumulation=false
# Replaces the advisor's default instruction, so it repeats it and adds how to phrase searches:
# as the task, not a keyword list (the jev index judges whether a tool performs the task).
spring.ai.chat.client.tool-search-advisor.system-message-suffix=\n\
You have access to a special tool called `toolSearchTool` that allows you to discover relevant tools on-demand. \
When you need to perform an action but don't see an appropriate tool in your current context, use `toolSearchTool` to search for it. \
When you call `toolSearchTool`, describe the task you need done in plain words \
(for example "find clothing shops in Landsmeer that are open right now"), not a list of keywords or alternatives.\n


spring.ai.inspector.enabled=true

