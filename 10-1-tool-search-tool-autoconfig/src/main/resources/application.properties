spring.main.banner-mode=off
spring.main.web-application-type=none
spring.threads.virtual.enabled=true

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.max-tokens=2000
spring.ai.anthropic.chat.model=claude-sonnet-5-5

spring.ai.openai.api-key=${OPENAI_API_KEY}
# spring.ai.openai.chat.model=gpt-6-luna
# spring.ai.openai.chat.temperature=1.0
spring.ai.openai.responses.model=gpt-6-luna
spring.ai.openai.chat.api=responses


# Tool Search Tool Advisor Configuration
spring.ai.chat.client.tool-search-advisor.enabled=true
# spring.ai.chat.client.tool-search-advisor.tool-index-type=regex
# spring.ai.chat.client.tool-search-advisor.tool-index-type=lucene
# spring.ai.chat.client.tool-search-advisor.tool-index-type=vector
spring.ai.chat.client.tool-search-advisor.tool-index-type=decision
# tool-index-type=decision: a DecisionModel picks the tools. Unlike the regex, lucene and
# vector indexes it can also answer "no tool applies".
# Below this, no tool is returned at all
spring.ai.chat.client.tool-search-advisor.decision.applicability-threshold=0.5
# Don't pad max-results with tools the decision model ruled out
spring.ai.chat.client.tool-search-advisor.decision.minimum-relevance=0.05

# The DecisionModel: TypeSafe's Jev through the System One provider. The OpenAI starter is
# on the classpath too and would contribute its own decision model.
spring.ai.model.decision=systemone
spring.ai.systemone.api-key=${TYPESAFE_API_KEY:}

spring.ai.chat.client.tool-search-advisor.reference-tool-name-accumulation=true
# Replaces the advisor's default instruction, so it repeats it and adds how to phrase searches:
# as the task, not a keyword list (the decision index judges whether a tool performs the task).
spring.ai.chat.client.tool-search-advisor.system-message-suffix=\n\
You have access to a special tool called `toolSearchTool` that allows you to discover relevant tools on-demand. \
When you need to perform an action but don't see an appropriate tool in your current context, use `toolSearchTool` to search for it. \
When you call `toolSearchTool`, describe the task you need done in plain words \
(for example "find clothing shops in Landsmeer that are open right now"), not a list of keywords or alternatives.\n


spring.ai.inspector.enabled=true

