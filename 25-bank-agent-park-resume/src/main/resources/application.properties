spring.application.name=bank-agent-park-resume
spring.main.banner-mode=off
spring.main.web-application-type=none
spring.threads.virtual.enabled=true

# The chat model: anthropic or openai. Override on the command line with
#   -Dspring-boot.run.arguments=--spring.ai.model.chat=anthropic
spring.ai.model.chat=openai

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.max-tokens=2000
spring.ai.anthropic.chat.model=claude-sonnet-5-5

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=gpt-5-mini-2025-08-07
spring.ai.openai.chat.temperature=1.0

# The customer the scripted conversation runs for (see data.sql), and the date the demo plays on.
# The date is pinned so that "this month" stays November 2026 whenever the demo runs.
demo.customer-id=1001
demo.today=2026-11-19

# One file-based database for the bank's data and for the session log, so that a second process
# finds the parked turn. AUTO_SERVER lets two processes open it at once.
spring.datasource.url=jdbc:h2:file:${java.io.tmpdir}/spring-ai-bank-agent-demo/bank;AUTO_SERVER=TRUE
# The bank's tables (schema.sql, data.sql): reset on every start
spring.sql.init.mode=always
# Spring AI 2.1 session memory: the JDBC session repository creates its tables (AI_SESSION, AI_SESSION_EVENT)
spring.ai.session.repository.jdbc.initialize-schema=always

# Spring AI 2.1 tool call limits: how often the model may call tools before the loop stops.
# The defaults are 40 calls per tool and 150 in total.
spring.ai.tools.limits.max-calls-per-tool-default=5
spring.ai.tools.limits.max-total-tool-calls=10

# MCP: one stdio server, declared in mcp-servers-config.json and started with npx. It gives the agent
# exchange rates (ECB reference rates).
spring.ai.mcp.client.name=bank-agent
spring.ai.mcp.client.request-timeout=60s
spring.ai.mcp.client.stdio.servers-configuration=classpath:/mcp-servers-config.json
# Hide the MCP stdio transport logs (the server's stderr is logged at INFO)
logging.level.io.modelcontextprotocol.client.transport.StdioClientTransport=WARN
logging.level.io.modelcontextprotocol.spec.McpClientSession=OFF

# Observability is off by default and on with the 'otel' profile (application-otel.properties). Without it the
# OpenTelemetry starter is on the classpath but exports nothing, so the plain run needs no Docker stack.
management.tracing.export.enabled=false
management.otlp.metrics.export.enabled=false
management.otlp.logging.export.enabled=false

agent.skills.dirs=classpath:/skills