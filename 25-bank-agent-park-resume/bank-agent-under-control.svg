<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1006 616" width="1006" role="img" aria-labelledby="bank-agent-title bank-agent-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="currentColor">
<defs><marker id="bank-agent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker><marker id="bank-agent-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F7DE0"/></marker><marker id="bank-agent-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6DB33F"/></marker></defs>
<title id="bank-agent-title">A bank support agent, under control</title>
<desc id="bank-agent-desc">The bank support agent demo. The harness is a ChatClient and its advisor chain. PiiMaskingAdvisor, an advisor of the application, masks the IBAN before anything leaves. TurnStatusAdvisor, from the community project Spring AI Session Extensions, starts the turn, parks it and resumes it. SessionTurnAdvisor records the turn once per call. ToolCallingAdvisor runs the tool loop and pauses when a call needs confirmation. SessionMemoryAdvisor adds the history on every round. ChatModelCallAdvisor calls the chat model, which is outside the harness. For each tool round the chain from ToolCallingAdvisor down runs again. The tool loop calls the bank's services, which are @Tool methods on existing @Service beans that read the customer id from the ToolContext; retryMortgagePaymentNow is marked requiresConfirmation. The tool loop has two more sources of tools: an external MCP server for exchange rates, to which the customer id is not sent, and Agent Skills from the community project Spring AI Agent Utils, where the refunds procedure is a file that the model loads only when it needs it. The session advisors read and write the session, the event log of the conversation: messages, tool calls, tool results, and the TURN.QUESTION and TURN.STATUS events of a parked turn. JdbcSessionRepository keeps it in the application's database, so it survives the process. In run 1 the customer sends two messages and the turn parks. In run 2, a new process, the approver's decision resumes the turn: TurnStatusAdvisor runs the approved call once. The turn interrupt and logging advisors of the demo are left out.</desc>
<text x="503" y="30" text-anchor="middle" font-size="20" font-weight="700">A bank support agent, <tspan fill="#6DB33F">under control</tspan></text>

<!-- The two callers -->
<rect x="300" y="46" width="170" height="46" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="385.0" y="66.0" text-anchor="middle" font-size="13" font-weight="600">Customer</text><text x="385.0" y="83.0" text-anchor="middle" font-size="11" fill-opacity="0.75">run 1: two messages</text>
<rect x="490" y="46" width="170" height="46" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="575.0" y="66.0" text-anchor="middle" font-size="13" font-weight="600">Approver</text><text x="575.0" y="83.0" text-anchor="middle" font-size="11" fill-opacity="0.75">run 2, a new process: decides</text>
<path d="M385.0 93.0 L385.0 138.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#bank-agent-arrow)"/>
<path d="M575.0 93.0 L575.0 138.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#bank-agent-arrow)"/>

