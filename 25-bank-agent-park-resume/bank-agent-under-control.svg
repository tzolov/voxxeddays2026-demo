<rect x="405" y="516" width="150" height="42" rx="8" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="480.0" y="541.5" text-anchor="middle" font-size="14">ChatModel</text>
<text x="575.0" y="542.0" text-anchor="start" font-size="15" font-weight="700">Model</text>

<!-- The bank's services -->
<rect x="14" y="288" width="216" height="104" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/>
<text x="122.0" y="310.0" text-anchor="middle" font-size="13" font-weight="600">The bank’s services</text>
<text x="122.0" y="328.0" text-anchor="middle" font-size="11" fill-opacity="0.75">@Tool on existing @Service beans</text>
<text x="122.0" y="344.0" text-anchor="middle" font-size="11" fill-opacity="0.75">customer id from the ToolContext</text>
<text x="122.0" y="366.0" text-anchor="middle" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace">retryMortgagePaymentNow</text>
<text x="122.0" y="382.0" text-anchor="middle" font-size="11" font-weight="600" fill="#6DB33F">requiresConfirmation = true</text>
<path d="M298.0 327.0 L233.0 327.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#bank-agent-arrow)"/>

