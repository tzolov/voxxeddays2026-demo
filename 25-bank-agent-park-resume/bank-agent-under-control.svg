<rect x="14" y="404" width="206" height="68" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/>
<text x="117.0" y="426.0" text-anchor="middle" font-size="13" font-weight="600">MCP server</text>
<text x="117.0" y="444.0" text-anchor="middle" font-size="11" fill-opacity="0.75">exchange rates (external)</text>
<text x="117.0" y="460.0" text-anchor="middle" font-size="11" font-weight="600" fill="#6DB33F">the customer id is not sent</text>
