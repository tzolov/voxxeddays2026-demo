<text x="274.0" y="126.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#6DB33F">Harness</text>
<text x="480.0" y="126.0" text-anchor="middle" font-size="12" fill-opacity="0.75" font-style="italic">ChatClient + advisor chain</text>

<rect x="300" y="140" width="360" height="46" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="480.0" y="160.0" text-anchor="middle" font-size="13" font-weight="600">PiiMaskingAdvisor</text><text x="480.0" y="177.0" text-anchor="middle" font-size="11" fill-opacity="0.75">masks the IBAN before anything leaves</text>
<rect x="300" y="198" width="360" height="46" rx="8" fill="#3F7DE0" fill-opacity="0.12" stroke="#3F7DE0" stroke-width="1.2"/><text x="480.0" y="218.0" text-anchor="middle" font-size="13" font-weight="600" fill="#3F7DE0">TurnStatusAdvisor</text><text x="480.0" y="235.0" text-anchor="middle" font-size="11" fill-opacity="0.8">starts the turn, parks it, resumes it</text>
<rect x="300" y="256" width="360" height="46" rx="8" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="480.0" y="276.0" text-anchor="middle" font-size="13" font-weight="600">SessionTurnAdvisor</text><text x="480.0" y="293.0" text-anchor="middle" font-size="11" fill-opacity="0.75">records the turn, once per call</text>
<rect x="300" y="314" width="360" height="46" rx="8" fill="#6DB33F"/><text x="480.0" y="334.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">ToolCallingAdvisor</text><text x="480.0" y="351.0" text-anchor="middle" font-size="11" fill="#fff">the loop: pauses when a call needs confirmation</text>
<rect x="300" y="372" width="360" height="46" rx="8" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="480.0" y="392.0" text-anchor="middle" font-size="13" font-weight="600">SessionMemoryAdvisor</text><text x="480.0" y="409.0" text-anchor="middle" font-size="11" fill-opacity="0.75">adds the history, on every round</text>
<rect x="300" y="430" width="360" height="46" rx="8" fill="#6DB33F"/><text x="480.0" y="450.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">ChatModelCallAdvisor</text><text x="480.0" y="467.0" text-anchor="middle" font-size="11" fill="#fff">calls the model</text>

<path d="M480.0 187.0 L480.0 196.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#bank-agent-arrow)"/>
<path d="M480.0 245.0 L480.0 254.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#bank-agent-arrow)"/>
<path d="M480.0 303.0 L480.0 312.0" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#bank-agent-arrow)"/>
