spring.main.banner-mode=off
spring.main.web-application-type=none
spring.threads.virtual.enabled=true

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-5-mini-2025-08-07
spring.ai.openai.chat.options.temperature=1.0
spring.ai.openai.audio.speech.options.model=tts-1
spring.ai.openai.audio.transcription.options.model=whisper-1

# Costs: one short speech synthesis (a few cents per run) and one transcription of it.
spring.ai.inspector.enabled=true
# What the inspector shows: the /v1/audio/speech round-trip with the text and voice and the audio (binary
# body, kept as a blob, with a player), then the /v1/audio/transcriptions round-trip with the uploaded file
# (multipart, the audio part kept) and the transcript. Both are nested in the chat call that asked for them.
