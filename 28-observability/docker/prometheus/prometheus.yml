global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: conference-helpdesk
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']   # the app on the host; a demo setting, not for production
  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
