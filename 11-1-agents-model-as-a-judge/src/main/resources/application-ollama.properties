# The judge on a local Ollama model, with no TypeSafe key:
#   ollama pull d1-omni:600m
#   mvn spring-boot:run -pl 11-1-agents-model-as-a-judge -Dspring-boot.run.profiles=ollama
spring.ai.model.decision=ollama
spring.ai.ollama.decision.model=d1-omni:600m

# d1-omni:600m gives a plausible answer about 0.68 and an absurd one about 0.21 (see 26-decision-models),
# so the 0.7 that fits Jev would reject correct answers.
demo.judge.plausible-threshold=0.5
