spring.main.banner-mode=off
spring.main.web-application-type=none
spring.threads.virtual.enabled=true

# The model under evaluation
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.max-tokens=2000
spring.ai.anthropic.chat.options.model=claude-sonnet-5-5

# TypeSafe AI Jev - the judge
spring.ai.typesafe.api-key=${TYPESAFE_API_KEY:}
spring.ai.typesafe.model=jev-latest
spring.ai.typesafe.timeout=10s
spring.ai.typesafe.retry.max-retries=2

spring.ai.chat.client.enabled=false

logging.level.org.springaicommunity.typesafe=INFO

spring.ai.inspector.enabled=true
