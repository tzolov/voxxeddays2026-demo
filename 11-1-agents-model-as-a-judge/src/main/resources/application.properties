spring.main.banner-mode=off
spring.main.web-application-type=none
spring.threads.virtual.enabled=true

# The model under evaluation
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.max-tokens=2000
spring.ai.anthropic.chat.model=claude-sonnet-5-5

# The Ollama starter is on the classpath too, for its decision model only
spring.ai.model.chat=anthropic
spring.ai.model.embedding=none

# The judge: TypeSafe's Jev, as a DecisionModel through the System One provider.
# The 'ollama' profile (application-ollama.properties) switches to a local model, with no TypeSafe key.
spring.ai.model.decision=systemone
spring.ai.systemone.api-key=${TYPESAFE_API_KEY:}
spring.ai.systemone.decision.model=jev-latest
spring.ai.systemone.timeout=10s
spring.ai.systemone.retry.max-retries=2

logging.level.org.springaicommunity.decision=INFO

spring.ai.inspector.enabled=true

# The probability of yes that the is_plausible criterion needs. Thresholds belong to a model:
# 0.7 fits Jev, and the 'ollama' profile sets its own.
demo.judge.plausible-threshold=0.7
