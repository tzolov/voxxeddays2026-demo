spring.application.name=spring-ai-inspector-server
spring.main.banner-mode=off
spring.threads.virtual.enabled=true
server.port=9001
# Local only: the event stream contains prompts, tool results and memory contents.
# Set to 0.0.0.0 deliberately if another machine must reach the inspector.
server.address=127.0.0.1
# The UI is plain ES modules: let the browser revalidate them so a rebuild is picked up.
spring.web.resources.cache.cachecontrol.no-cache=true

# Upstreams the recording proxy forwards to: <inspector>/r/<runId>/<provider>/...
spring.ai.inspector.upstreams.anthropic=https://api.anthropic.com
spring.ai.inspector.upstreams.openai=https://api.openai.com
spring.ai.inspector.upstreams.ollama=http://localhost:11434
spring.ai.inspector.upstreams.mistralai=https://api.mistral.ai
spring.ai.inspector.upstreams.deepseek=https://api.deepseek.com
spring.ai.inspector.upstreams.typesafe=https://api.typesafe.ai

# Access. The event log holds prompts, tool results and memory contents, and run-start events
# decide where the proxy forwards API keys. Requests whose Host header isn't a loopback name are
# refused (DNS rebinding); add other names with spring.ai.inspector.allowed-hosts. Set a token to
# require X-Inspector-Token on /api/** (the same value in the instrumented apps'
# spring.ai.inspector.token); the proxy then serves only runs registered with it.
#spring.ai.inspector.token=
#spring.ai.inspector.allowed-hosts=inspector.local

# Capture limits: longest recorded body (characters), byte budget of the event log, largest
# accepted event post. Inline base64 (images, audio) is always replaced by a marker.
spring.ai.inspector.max-body-chars=512000
spring.ai.inspector.max-total-bytes=268435456
spring.ai.inspector.max-request-bytes=16777216
