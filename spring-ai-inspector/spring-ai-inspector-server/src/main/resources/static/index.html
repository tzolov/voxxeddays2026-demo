<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring AI Inspector</title>
<script>
// The saved color scheme and theme, applied before the first paint (main.js keeps them up to date).
try {
	const palette = localStorage.getItem('inspector.palette'); const theme = localStorage.getItem('inspector.theme');
	if (palette) document.documentElement.dataset.palette = palette;
	if (theme) document.documentElement.dataset.theme = theme;
} catch { /* no storage: defaults */ }
</script>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/inspector.css">
</head>
<body>
<div class="topbar">
	<button class="btn" id="sidebar-toggle" title="Show / hide the runs panel" aria-controls="sidebar">☰</button>
	<div class="brand"><span class="dot" id="conn"></span>
		<img class="brand-logo on-light" src="img/spring-ai-title-logo-light.svg" alt="Spring AI">
		<img class="brand-logo on-dark" src="img/spring-ai-title-logo-dark.svg" alt="Spring AI">
		<span class="brand-name"><span class="brand-prefix">Spring AI </span>Inspector</span></div>
	<div class="spacer"></div>
	<button class="btn" id="follow" title="Jump to each new run automatically">Follow new runs</button>
	<div class="btn-group">
		<button class="btn" data-scale="-1" title="Smaller text">A−</button>
		<button class="btn" data-scale="1" title="Larger text">A+</button>
	</div>
	<button class="btn" id="theme" title="Toggle light / dark">◐</button>
	<button class="btn" id="palette" title="Color scheme: Inspector / Spring">🌱</button>
	<button class="btn" id="import" title="Load runs saved with Export">Import</button>
	<input type="file" id="import-file" accept=".json,application/json" multiple hidden>
	<button class="btn" id="clear" title="Remove all captured runs">Clear</button>
</div>
<div class="replay" id="replay" hidden></div>
<div class="layout">
	<aside class="sidebar" id="sidebar"><h2>Runs</h2><div id="runs"></div></aside>
	<main class="main" id="main"></main>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
