spring.main.banner-mode=off
spring.main.web-application-type=none
spring.threads.virtual.enabled=true

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.max-tokens=2000
spring.ai.anthropic.chat.model=claude-sonnet-5-5


agent.memory.dir=${user.home}/.spring-ai-agent/spring-io-2026/memory

spring.ai.inspector.enabled=true
# The memory files the inspector shows in the "Memory after this call" step.
spring.ai.inspector.memory-dirs=${agent.memory.dir}

# The user whose past sessions the Dreamer may search
agent.user-id=alice
