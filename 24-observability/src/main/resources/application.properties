spring.application.name=conference-helpdesk
spring.main.banner-mode=off
spring.threads.virtual.enabled=true
server.port=8080

# The two providers the helpdesk answers with, in turn. Haiku and mini keep a 10-minute run cheap.
# Anthropic - provider configuration
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=claude-haiku-5-5
spring.ai.anthropic.chat.max-tokens=600
# OpenAI - provider configuration
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-5-mini-2025-08-07
spring.ai.openai.embedding.model=text-embedding-3-small

# Built-in traffic: one question every interval, alternating providers. POST /traffic/stop pauses it.
helpdesk.traffic.enabled=true
helpdesk.traffic.interval=4s

# --- Metrics -------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
# One tag on every metric and span, so the dashboards can filter by application: on the observations
# (Spring AI's timers, the spans) and on the plain meters (the JVM metrics, the app's own counter).
management.observations.key-values.application=${spring.application.name}
management.metrics.tags.application=${spring.application.name}
# Histogram buckets for the Spring AI timers, so Grafana can draw percentiles (and attach exemplars).
management.metrics.distribution.percentiles-histogram.gen_ai.client.operation=true
management.metrics.distribution.percentiles-histogram.spring.ai.chat.client=true
management.metrics.distribution.percentiles-histogram.spring.ai.advisor=true
management.metrics.distribution.percentiles-histogram.spring.ai.tool=true
management.metrics.distribution.percentiles-histogram.db.vector.client.operation=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Prometheus scrapes; the OpenTelemetry starter's OTLP metrics push is not used.
management.otlp.metrics.export.enabled=false

# --- Traces --------------------------------------------------------------------------------
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
# Observations survive thread hops in reactive code (streaming) only with context propagation.
spring.reactor.context-propagation=auto

# --- Content in observations ---------------------------------------------------------------
# Off: prompts and completions stay out of logs and spans. POST /chaos?logContent=true logs the
# question and the answer live, with the trace id, which is the point to make about privacy.
# These Spring AI switches put the full prompt and completion into the span events and need a restart:
# spring.ai.chat.observations.log-prompt=true
# spring.ai.chat.observations.log-completion=true
# spring.ai.tools.observations.include-content=true

spring.ai.inspector.enabled=true
