# Prometheus scrapes the app on the host, the app sends traces to Tempo and logs to Loki, Grafana shows all three.
# The app itself runs from the IDE or `mvn spring-boot:run`, not in a container.
name: voxxed-observability
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage         # latency samples carry trace ids
      - --web.enable-remote-write-receiver        # Tempo's span metrics land here
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"   # Tempo API (Grafana)
      - "4318:4318"   # OTLP/HTTP, where the app sends spans
  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"   # push API, where the app's Logback appender sends the log lines
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
