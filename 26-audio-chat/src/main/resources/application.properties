spring.main.banner-mode=off
spring.main.web-application-type=none
spring.threads.virtual.enabled=true

spring.ai.openai.api-key=${OPENAI_API_KEY}
# The audio-capable chat model (Chat Completions): text and audio in, text and audio out.
spring.ai.openai.chat.model=gpt-audio-1.5
spring.ai.openai.audio.speech.model=tts-1

spring.ai.inspector.enabled=true
# What the inspector shows: the spoken question as audio input in the chat request (base64 stripped and
# kept, playable), the spoken answer as audio output in the response (kept, playable) with its transcript.
# Costs: one short speech synthesis and one audio chat turn ($32 / $64 per million audio tokens): cents.
