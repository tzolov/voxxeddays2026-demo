spring.main.banner-mode=off
spring.main.web-application-type=none
spring.threads.virtual.enabled=true

# spring.ai.anthropic.base-url=http://localhost:8888
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.max-tokens=2000
spring.ai.anthropic.chat.model=claude-sonnet-5-5

# Enable or disable tool calling globally for the chat client
# spring.ai.chat.client.tool-calling.enabled=false

spring.ai.inspector.enabled=true
