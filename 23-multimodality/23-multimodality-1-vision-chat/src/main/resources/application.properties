spring.main.banner-mode=off
spring.main.web-application-type=none
spring.threads.virtual.enabled=true

# Two chat providers on the classpath: this picks the one the ChatClient uses.
# Default: Claude (images and PDFs). Run with --spring.profiles.active=ollama for a local vision model (images only).
spring.ai.model.chat=anthropic
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=claude-sonnet-5-5
spring.ai.anthropic.chat.max-tokens=1000

spring.ai.inspector.enabled=true
# What the inspector shows: the chart and the PDF as media in "Your app sent" and in the wire request, the
# base64 stripped from the recorded body and kept as a blob (thumbnail for the image), the model's answer.
# Costs: a chart (small) and a 3 MB PDF to Claude: a few cents per run. The Ollama profile is free.
