spring.main.banner-mode=off
spring.main.web-application-type=none
spring.threads.virtual.enabled=true

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-5-mini-2025-08-07
spring.ai.openai.chat.temperature=1.0
# The demo names the model on each call (runtime options default the model when they don't, whatever this
# says). OpenAI's images API answers in base64 and no longer accepts response_format.
spring.ai.openai.image.options.model=gpt-image-1-mini

# Costs: each run makes three images with gpt-image-1-mini (a few cents) and one chat call.
spring.ai.inspector.enabled=true
# What the inspector shows depends on the route:
# - routed (default): the HTTP round-trips to /v1/images/generations, with the prompt, the images (kept as
#   blobs, shown as thumbnails) and the token usage;
# - not routed (spring.ai.inspector.proxy.openai unset and spring.ai.openai.base-url pointing elsewhere, or
#   simply `--spring.ai.inspector.route.openai=never` once that exists): the same calls reported from the
#   ImageModel bean instead, marked "ImageModel call · no HTTP". To see that path today, point the base URL at
#   a gateway: --spring.ai.openai.base-url=https://your-gateway/openai
