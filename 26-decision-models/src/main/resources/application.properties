spring.application.name=decision-models
spring.main.banner-mode=off
spring.main.web-application-type=none
logging.level.root=WARN

# The decision model: a local Ollama model, no API key. Pull it first: ollama pull d1-omni:600m
# The 'jev' profile (application-jev.properties) switches to TypeSafe's Jev.
spring.ai.model.decision=ollama
spring.ai.ollama.decision.model=d1-omni:600m

# This demo calls no chat or embedding model
spring.ai.model.chat=none
spring.ai.model.embedding=none

# The threshold of the judge's is_plausible criterion. Thresholds belong to a model: see the README.
demo.judge.plausible-threshold=0.5
