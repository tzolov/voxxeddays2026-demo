spring.main.banner-mode=off
spring.main.web-application-type=none
spring.threads.virtual.enabled=true

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.max-tokens=2000
spring.ai.anthropic.chat.options.model=claude-sonnet-4-6

agent.skills.dirs=classpath:/skills

# Stdio MCP server(s): the exchange-rate server (ECB rates via Frankfurter) started with npx
spring.ai.mcp.client.name=bank-support-agent
spring.ai.mcp.client.request-timeout=60s
spring.ai.mcp.client.stdio.servers-configuration=classpath:/mcp-servers-config.json
