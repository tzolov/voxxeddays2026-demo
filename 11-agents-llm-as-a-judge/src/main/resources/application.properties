spring.main.banner-mode=off
spring.main.web-application-type=none
spring.threads.virtual.enabled=true

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-5-mini-2025-08-07
spring.ai.openai.chat.temperature=1.0

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.max-tokens=2000
spring.ai.anthropic.chat.model=claude-sonnet-4-6


#spring.ai.ollama.chat.options.model=qwen3.5:2b
# spring.ai.ollama.chat.options.model=avcodes/flowaicom-flow-judge:q4
spring.ai.ollama.chat.model=qwen3:0.6b
#spring.ai.ollama.chat.options.model= granite4.1-guardian:8b
spring.ai.ollama.chat.temperature=0

spring.ai.chat.client.enabled=false

#logging.level.org.springframework.ai.chat.client.advisor.StructuredOutputValidationAdvisor=DEBUG

spring.ai.inspector.enabled=true